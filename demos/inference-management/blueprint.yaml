---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-management-test-0-1-0
  namespace: inference-management
  labels:
    app.kubernetes.io/part-of: inference-management
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: inference-management
        app.kubernetes.io/component: test
    spec:
      serviceAccountName: inference-management-test
      restartPolicy: Never
      containers:
        - name: assertions
          image: curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: NAMESPACE
              value: inference-management
            - name: GPU_COUNT
              value: "0" # INPUT: keep aligned with requestGPU
            - name: MODEL_ALIAS
              value: mvp-model
            - name: TEST_PROMPT
              value: "Observability-path functional test" # INPUT
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PROXY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-management-secrets
                  key: PROXY_MASTER_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-management-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-management-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: CAPTURE_MODE
              valueFrom:
                secretKeyRef:
                  name: inference-management-secrets
                  key: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: inference-management-secrets
                  key: GRAFANA_ADMIN_USER
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inference-management-secrets
                  key: GRAFANA_ADMIN_PASSWORD
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              API="https://kubernetes.default.svc"
              SA="/var/run/secrets/kubernetes.io/serviceaccount"
              VLLM="http://vllm-stack-smollm2-engine-service"
              LITELLM="http://litellm:4000"
              LANGFUSE="http://langfuse-web:3000"
              PROMETHEUS="http://inference-monitoring-prometheus:9090"
              GRAFANA="http://inference-grafana"
              TRACE_ID="$(printf '%s' "$POD_UID" | tr -d '-' | cut -c1-32)"
              SPAN_ID="$(printf '%s' "$TRACE_ID" | cut -c1-16)"
              case "$(printf '%s' "$TRACE_ID" | cut -c1)" in
                f) FAIL_TRACE_ID="e$(printf '%s' "$TRACE_ID" | cut -c2-32)" ;;
                *) FAIL_TRACE_ID="f$(printf '%s' "$TRACE_ID" | cut -c2-32)" ;;
              esac
              MARKER="mvp-observability-$POD_UID"
              RESPONSE_MARKER="mvp-response-$(printf '%s' "$TRACE_ID" | cut -c1-8)"
              TEST_PROMPT_JSON="$(printf '%s' "$TEST_PROMPT" | \
                sed 's/\\/\\\\/g; s/"/\\"/g' | tr '\r\n' '  ')"
              RESULT="FAIL"
              STEP="starting"
              FAILED_TRACE_STATUS="NOT_CHECKED"

              kube_curl() {
                curl -fsS --max-time 10 --cacert "$SA/ca.crt" \
                  -H "Authorization: Bearer $(cat "$SA/token")" "$@"
              }

              publish() {
                completed="$(date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date)"
                body="{\"data\":{\"status\":\"$RESULT\",\"detail\":\"$STEP\",\"marker\":\"$MARKER\",\"traceID\":\"$TRACE_ID\",\"captureMode\":\"$CAPTURE_MODE\",\"failedTraceStatus\":\"$FAILED_TRACE_STATUS\",\"completedAt\":\"$completed\"}}"
                kube_curl -X PATCH \
                  -H 'Content-Type: application/merge-patch+json' \
                  --data "$body" \
                  "$API/api/v1/namespaces/$NAMESPACE/configmaps/inference-management-test-results" \
                  >/dev/null 2>&1 || true
              }

              finish() {
                rc=$?
                trap - EXIT
                publish
                if [ "$rc" -eq 0 ]; then
                  printf 'PASS marker=%s trace_id=%s\n' "$MARKER" "$TRACE_ID"
                else
                  printf 'FAIL step=%s marker=%s trace_id=%s\n' "$STEP" "$MARKER" "$TRACE_ID" >&2
                fi
                exit "$rc"
              }
              trap finish EXIT

              wait_url() {
                name="$1"
                url="$2"
                shift 2
                i=0
                until curl -fsS --max-time 5 "$@" "$url" >/dev/null 2>&1; do
                  i=$((i + 1))
                  if [ "$i" -ge 360 ]; then
                    printf 'timed out waiting for %s\n' "$name" >&2
                    return 1
                  fi
                  sleep 5
                done
              }

              wait_kube_url() {
                name="$1"
                url="$2"
                i=0
                until kube_curl "$url" >/dev/null 2>&1; do
                  i=$((i + 1))
                  if [ "$i" -ge 360 ]; then
                    printf 'timed out waiting for Kubernetes resource %s\n' "$name" >&2
                    return 1
                  fi
                  sleep 5
                done
              }

              metric_sum() {
                metric="$1"
                file="$2"
                awk -v metric="$metric" '
                  $1 == metric || index($1, metric "{") == 1 { total += $NF }
                  END { printf "%.9f\n", total + 0 }
                ' "$file"
              }

              metric_increased() {
                before="$1"
                after="$2"
                awk -v before="$before" -v after="$after" \
                  'BEGIN { exit(after > before ? 0 : 1) }'
              }

              prom_has() {
                query="$1"
                curl -fsSG --max-time 10 --data-urlencode "query=$query" \
                  "$PROMETHEUS/api/v1/query" | grep -q '"result":\[{'
              }

              wait_prom() {
                name="$1"
                query="$2"
                i=0
                until prom_has "$query"; do
                  i=$((i + 1))
                  if [ "$i" -ge 60 ]; then
                    printf 'timed out waiting for Prometheus assertion %s\n' "$name" >&2
                    return 1
                  fi
                  sleep 5
                done
              }

              pod_restart_sum() {
                kube_curl "$API/api/v1/namespaces/$NAMESPACE/pods" | \
                  grep -oE '"restartCount"[[:space:]]*:[[:space:]]*[0-9]+' | \
                  tr -cd '0-9\n' | awk '{ total += $1 } END { print total + 0 }'
              }

              selected_pod_uids() {
                for selector in \
                  'app.kubernetes.io%2Fname%3Dlitellm' \
                  'app.kubernetes.io%2Fcomponent%3Dserving-engine' \
                  'app.kubernetes.io%2Finstance%3Dlangfuse'; do
                  kube_curl "$API/api/v1/namespaces/$NAMESPACE/pods?labelSelector=$selector"
                done | grep -oE '"uid"[[:space:]]*:[[:space:]]*"[^"]+"' | \
                  cut -d '"' -f 4 | sort
              }

              STEP="prerequisites"
              kube_curl "$API/version" >/dev/null
              storage_classes="$(kube_curl "$API/apis/storage.k8s.io/v1/storageclasses")"
              printf '%s' "$storage_classes" | grep -Eq \
                '"storageclass(\.beta)?\.kubernetes\.io/is-default-class"[[:space:]]*:[[:space:]]*"true"' || \
                fail "the cluster has no default StorageClass"
              kube_curl "$API/api/v1/namespaces/$NAMESPACE/secrets/inference-management-secrets" >/dev/null
              wait_kube_url Prometheus \
                "$API/apis/apiextensions.k8s.io/v1/customresourcedefinitions/prometheuses.monitoring.coreos.com"
              wait_kube_url ServiceMonitor \
                "$API/apis/apiextensions.k8s.io/v1/customresourcedefinitions/servicemonitors.monitoring.coreos.com"
              if [ "$GPU_COUNT" -gt 0 ]; then
                kube_curl "$API/api/v1/nodes" > /tmp/nodes.json
                available_gpus="$(tr -d '\n' < /tmp/nodes.json | \
                  grep -oE '"allocatable"[[:space:]]*:[[:space:]]*\{[^}]*\}' | \
                  grep -oE '"nvidia\.com/gpu"[[:space:]]*:[[:space:]]*"[0-9]+"' | \
                  tr -cd '0-9\n' | awk '{ total += $1 } END { print total + 0 }')"
                [ "$available_gpus" -ge "$GPU_COUNT" ]
              fi

              STEP="wait-for-components"
              wait_url vLLM "$VLLM/health"
              wait_url LiteLLM "$LITELLM/health/readiness" \
                -H "Authorization: Bearer $PROXY_MASTER_KEY"
              wait_url Langfuse "$LANGFUSE/api/public/ready"
              wait_url Prometheus "$PROMETHEUS/-/ready"
              wait_url Grafana "$GRAFANA/api/health"
              i=0
              until curl -fsS --max-time 10 \
                -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" \
                "$GRAFANA/api/search?query=Inference%20Management%20MVP" | \
                grep -q '"uid":"inference-management-mvp"'; do
                i=$((i + 1))
                [ "$i" -lt 60 ] || exit 1
                sleep 5
              done

              # Establish scrape baselines before generating the traffic whose
              # rates/deltas are asserted later.
              kube_curl \
                "$API/api/v1/namespaces/$NAMESPACE/pods?labelSelector=app.kubernetes.io%2Fname%3Dlitellm" \
                > /tmp/litellm-baseline-pods.json
              baseline_litellm_pod="$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]+"' \
                /tmp/litellm-baseline-pods.json | head -n 1 | cut -d '"' -f 4)"
              [ -n "$baseline_litellm_pod" ]
              wait_prom initial-litellm-target \
                "up{namespace=\"$NAMESPACE\",service=\"litellm\",pod=\"$baseline_litellm_pod\"} == 1"
              wait_prom initial-vllm-target \
                "up{namespace=\"$NAMESPACE\",service=\"vllm-stack-smollm2-engine-service\"} == 1"
              wait_prom initial-kubernetes-health-target \
                "up{namespace=\"$NAMESPACE\",service=\"vllm-stack-kube-state-metrics\"} == 1"
              warmup_code="$(curl -sS --max-time 30 -o /tmp/failure-warmup.json \
                -w '%{http_code}' -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                -H 'Content-Type: application/json' \
                --data '{"model":"metrics-baseline-does-not-exist","messages":[{"role":"user","content":"metrics baseline"}]}' \
                "$LITELLM/v1/chat/completions")"
              case "$warmup_code" in 400|404|422) : ;; *) exit 1 ;; esac
              wait_prom failure-counter-baseline \
                "sum(litellm_proxy_failed_requests_metric_total{pod=\"$baseline_litellm_pod\"}) > 0"

              baseline_restarts="$(pod_restart_sum)"
              baseline_uids="$(selected_pod_uids)"
              [ -n "$baseline_uids" ]

              STEP="direct-vllm-inference"
              curl -fsS --max-time 10 "$VLLM/metrics" > /tmp/vllm-before-direct.metrics
              direct_requests_before="$(metric_sum 'vllm:request_success_total' /tmp/vllm-before-direct.metrics)"
              direct_prompt_before="$(metric_sum 'vllm:prompt_tokens_total' /tmp/vllm-before-direct.metrics)"
              direct_generation_before="$(metric_sum 'vllm:generation_tokens_total' /tmp/vllm-before-direct.metrics)"
              code="$(curl -sS --max-time 180 -o /tmp/direct.json -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                --data "{\"model\":\"$MODEL_ALIAS\",\"messages\":[{\"role\":\"user\",\"content\":\"$TEST_PROMPT_JSON. Reply with a short confirmation. $MARKER\"}],\"temperature\":0,\"max_tokens\":24}" \
                "$VLLM/v1/chat/completions")"
              [ "$code" = "200" ]
              grep -Eq '"object"[[:space:]]*:[[:space:]]*"chat\.completion"' /tmp/direct.json
              grep -Eq '"model"[[:space:]]*:[[:space:]]*"mvp-model"' /tmp/direct.json
              grep -Eq '"choices"[[:space:]]*:[[:space:]]*\[[[:space:]]*\{' /tmp/direct.json
              grep -Eq '"content"[[:space:]]*:[[:space:]]*"[^\"]+' /tmp/direct.json
              grep -Eq '"prompt_tokens"[[:space:]]*:[[:space:]]*[1-9][0-9]*' /tmp/direct.json
              grep -Eq '"completion_tokens"[[:space:]]*:[[:space:]]*[1-9][0-9]*' /tmp/direct.json
              curl -fsS --max-time 10 "$VLLM/metrics" > /tmp/vllm-after-direct.metrics
              metric_increased "$direct_requests_before" \
                "$(metric_sum 'vllm:request_success_total' /tmp/vllm-after-direct.metrics)"
              metric_increased "$direct_prompt_before" \
                "$(metric_sum 'vllm:prompt_tokens_total' /tmp/vllm-after-direct.metrics)"
              metric_increased "$direct_generation_before" \
                "$(metric_sum 'vllm:generation_tokens_total' /tmp/vllm-after-direct.metrics)"

              STEP="litellm-routing"
              curl -fsS --max-time 10 -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                "$LITELLM/metrics" > /tmp/litellm-before-proxy.metrics
              curl -fsS --max-time 10 "$VLLM/metrics" > /tmp/vllm-before-proxy.metrics
              proxy_requests_before="$(metric_sum 'litellm_proxy_total_requests_metric_total' /tmp/litellm-before-proxy.metrics)"
              backend_requests_before="$(metric_sum 'vllm:request_success_total' /tmp/vllm-before-proxy.metrics)"
              code="$(curl -sS --max-time 180 -o /tmp/proxy.json -w '%{http_code}' \
                -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                -H 'Content-Type: application/json' \
                -H "traceparent: 00-$TRACE_ID-$SPAN_ID-01" \
                --data "{\"model\":\"$MODEL_ALIAS\",\"messages\":[{\"role\":\"user\",\"content\":\"$TEST_PROMPT_JSON. Reply with exactly $RESPONSE_MARKER and nothing else. $MARKER\"}],\"temperature\":0,\"max_tokens\":24}" \
                "$LITELLM/v1/chat/completions")"
              [ "$code" = "200" ]
              grep -Eq '"object"[[:space:]]*:[[:space:]]*"chat\.completion"' /tmp/proxy.json
              grep -Eq '"model"[[:space:]]*:[[:space:]]*"mvp-model"' /tmp/proxy.json
              grep -Eq '"choices"[[:space:]]*:[[:space:]]*\[[[:space:]]*\{' /tmp/proxy.json
              grep -Eq '"content"[[:space:]]*:[[:space:]]*"[^\"]+' /tmp/proxy.json
              grep -Fq "$RESPONSE_MARKER" /tmp/proxy.json
              grep -Eq '"prompt_tokens"[[:space:]]*:[[:space:]]*[1-9][0-9]*' /tmp/proxy.json
              grep -Eq '"completion_tokens"[[:space:]]*:[[:space:]]*[1-9][0-9]*' /tmp/proxy.json
              curl -fsS --max-time 10 -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                "$LITELLM/metrics" > /tmp/litellm-after-proxy.metrics
              curl -fsS --max-time 10 "$VLLM/metrics" > /tmp/vllm-after-proxy.metrics
              metric_increased "$proxy_requests_before" \
                "$(metric_sum 'litellm_proxy_total_requests_metric_total' /tmp/litellm-after-proxy.metrics)"
              metric_increased "$backend_requests_before" \
                "$(metric_sum 'vllm:request_success_total' /tmp/vllm-after-proxy.metrics)"

              STEP="intentional-failure"
              curl -fsS --max-time 10 -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                "$LITELLM/metrics" > /tmp/litellm-before-failure.metrics
              failures_before="$(metric_sum 'litellm_proxy_failed_requests_metric_total' /tmp/litellm-before-failure.metrics)"
              code="$(curl -sS --max-time 30 -o /tmp/failure.json -w '%{http_code}' \
                -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                -H 'Content-Type: application/json' \
                -H "traceparent: 00-$FAIL_TRACE_ID-$SPAN_ID-01" \
                --data '{"model":"does-not-exist","messages":[{"role":"user","content":"expected failure"}]}' \
                "$LITELLM/v1/chat/completions")"
              case "$code" in 400|404|422) : ;; *) exit 1 ;; esac
              grep -Eq '"(error|detail)"[[:space:]]*:' /tmp/failure.json
              sleep 2
              curl -fsS --max-time 10 -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                "$LITELLM/metrics" > /tmp/litellm-failure.metrics
              metric_increased "$failures_before" \
                "$(metric_sum 'litellm_proxy_failed_requests_metric_total' /tmp/litellm-failure.metrics)"

              STEP="concurrent-load"
              batch=1
              while [ "$batch" -le 5 ]; do
                request=1
                pids=""
                while [ "$request" -le 4 ]; do
                  curl -fsS --max-time 180 -o /dev/null \
                    -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                    -H 'Content-Type: application/json' \
                    --data "{\"model\":\"$MODEL_ALIAS\",\"messages\":[{\"role\":\"user\",\"content\":\"Write a detailed 64-word explanation for $MARKER load-$batch-$request\"}],\"temperature\":0,\"max_tokens\":64}" \
                    "$LITELLM/v1/chat/completions" &
                  pids="$pids $!"
                  request=$((request + 1))
                done
                for pid in $pids; do
                  wait "$pid"
                done
                batch=$((batch + 1))
              done

              # The failed call and load must not crash or replace components.
              [ "$(pod_restart_sum)" = "$baseline_restarts" ]
              [ "$(selected_pod_uids)" = "$baseline_uids" ]

              STEP="prometheus-ingestion"
              wait_prom litellm-target \
                "up{namespace=\"$NAMESPACE\",service=\"litellm\"} == 1"
              wait_prom vllm-target \
                "up{namespace=\"$NAMESPACE\",service=\"vllm-stack-smollm2-engine-service\"} == 1"
              wait_prom kubernetes-health-target \
                "up{namespace=\"$NAMESPACE\",service=\"vllm-stack-kube-state-metrics\"} == 1"
              wait_prom litellm-request-rate \
                'sum(rate(litellm_proxy_total_requests_metric_total[2m])) > 0'
              wait_prom vllm-request-rate \
                'sum(rate(vllm:request_success_total[2m])) > 0'
              wait_prom token-throughput \
                'sum(rate(vllm:generation_tokens_total[2m])) > 0'
              wait_prom failure-observed \
                'sum(increase(litellm_proxy_failed_requests_metric_total[5m])) > 0'
              wait_prom running-requests-reacted \
                'max_over_time(vllm:num_requests_running[5m]) > 0'
              wait_prom workload-pods-ready \
                "min(kube_pod_status_ready{namespace=\"$NAMESPACE\",condition=\"true\",pod=~\"(litellm|vllm-stack-smollm2|langfuse-(web|worker)).*\"}) == 1"
              if [ "$GPU_COUNT" -gt 0 ]; then
                wait_prom dcgm-target \
                  "up{namespace=\"$NAMESPACE\",service=\"dcgm-exporter\"} == 1"
                wait_prom gpu-activity \
                  'max_over_time(DCGM_FI_DEV_GPU_UTIL[5m]) > 0'
                wait_prom gpu-memory \
                  'DCGM_FI_DEV_FB_USED > 0'
              fi

              STEP="langfuse-correlation"
              i=0
              while :; do
                code="$(curl -sS --max-time 10 \
                  -u "$LANGFUSE_PUBLIC_KEY:$LANGFUSE_SECRET_KEY" \
                  -o /tmp/trace.json -w '%{http_code}' \
                  "$LANGFUSE/api/public/traces/$TRACE_ID" || true)"
                capture_ok=false
                if [ "$code" = "200" ] && \
                   grep -Fq "$MODEL_ALIAS" /tmp/trace.json && \
                   grep -Eq '"startTime"[[:space:]]*:[[:space:]]*"[^"]+"' /tmp/trace.json && \
                   grep -Eq '"endTime"[[:space:]]*:[[:space:]]*"[^"]+"' /tmp/trace.json && \
                   grep -Eq '"(input|inputTokens|input_tokens|promptTokens)"[[:space:]]*:[[:space:]]*[1-9][0-9]*' /tmp/trace.json && \
                   grep -Eq '"(output|outputTokens|output_tokens|completionTokens)"[[:space:]]*:[[:space:]]*[1-9][0-9]*' /tmp/trace.json && \
                   ! grep -Eq '"level"[[:space:]]*:[[:space:]]*"ERROR"' /tmp/trace.json; then
                  case "$CAPTURE_MODE" in
                    no_content)
                      if ! grep -Fq "$MARKER" /tmp/trace.json && \
                         ! grep -Fq "$RESPONSE_MARKER" /tmp/trace.json; then
                        capture_ok=true
                      fi
                      ;;
                    span_only)
                      if grep -Fq "$MARKER" /tmp/trace.json && \
                         grep -Fq "$RESPONSE_MARKER" /tmp/trace.json; then
                        capture_ok=true
                      fi
                      ;;
                    *)
                      printf 'unsupported capture mode %s\n' "$CAPTURE_MODE" >&2
                      exit 1
                      ;;
                  esac
                fi
                [ "$capture_ok" = true ] && break
                i=$((i + 1))
                [ "$i" -lt 60 ] || exit 1
                sleep 5
              done

              # A failed request trace is integration/version dependent. Report it
              # explicitly without making this optional path fail the whole MVP.
              fail_code=000
              if fetched_code="$(curl -sS --max-time 10 \
                -u "$LANGFUSE_PUBLIC_KEY:$LANGFUSE_SECRET_KEY" \
                -o /tmp/failure-trace.json -w '%{http_code}' \
                "$LANGFUSE/api/public/traces/$FAIL_TRACE_ID")"; then
                fail_code="$fetched_code"
              fi
              if [ "$fail_code" = "200" ]; then
                if grep -Eq '"level"[[:space:]]*:[[:space:]]*"ERROR"|"exception[^\"]*"[[:space:]]*:' \
                  /tmp/failure-trace.json; then
                  FAILED_TRACE_STATUS="ERROR_RECORDED"
                else
                  FAILED_TRACE_STATUS="RECORDED_WITHOUT_ERROR_STATUS"
                fi
              else
                FAILED_TRACE_STATUS="UNSUPPORTED_HTTP_$fail_code"
              fi
              printf 'failed-request Langfuse trace status %s\n' "$FAILED_TRACE_STATUS"

              STEP="litellm-restart-recovery"
              kube_curl \
                "$API/api/v1/namespaces/$NAMESPACE/pods?labelSelector=app.kubernetes.io%2Fname%3Dlitellm" \
                > /tmp/litellm-pods-before.json
              old_pod_name="$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]+"' \
                /tmp/litellm-pods-before.json | head -n 1 | cut -d '"' -f 4)"
              old_pod_uid="$(grep -oE '"uid"[[:space:]]*:[[:space:]]*"[^"]+"' \
                /tmp/litellm-pods-before.json | head -n 1 | cut -d '"' -f 4)"
              [ -n "$old_pod_name" ]
              [ -n "$old_pod_uid" ]
              kube_curl -X DELETE \
                -H 'Content-Type: application/json' \
                --data '{"apiVersion":"v1","kind":"DeleteOptions","gracePeriodSeconds":0}' \
                "$API/api/v1/namespaces/$NAMESPACE/pods/$old_pod_name" \
                >/dev/null
              i=0
              while :; do
                kube_curl \
                  "$API/api/v1/namespaces/$NAMESPACE/pods?labelSelector=app.kubernetes.io%2Fname%3Dlitellm" \
                  > /tmp/litellm-pods-after.json
                new_pod_name="$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]+"' \
                  /tmp/litellm-pods-after.json | head -n 1 | cut -d '"' -f 4)"
                new_pod_uid="$(grep -oE '"uid"[[:space:]]*:[[:space:]]*"[^"]+"' \
                  /tmp/litellm-pods-after.json | head -n 1 | cut -d '"' -f 4)"
                if [ -n "$new_pod_uid" ] && \
                   [ "$new_pod_uid" != "$old_pod_uid" ] && \
                   ! grep -Fq "$old_pod_uid" /tmp/litellm-pods-after.json; then
                  break
                fi
                i=$((i + 1))
                [ "$i" -lt 120 ] || exit 1
                sleep 5
              done
              wait_url LiteLLM "$LITELLM/health/readiness" \
                -H "Authorization: Bearer $PROXY_MASTER_KEY"
              curl -fsS --max-time 10 -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                "$LITELLM/metrics" > /tmp/litellm-before-recovery.metrics
              recovery_requests_before="$(metric_sum 'litellm_proxy_total_requests_metric_total' \
                /tmp/litellm-before-recovery.metrics)"
              curl -fsS --max-time 180 -o /tmp/recovery.json \
                -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                -H 'Content-Type: application/json' \
                --data "{\"model\":\"$MODEL_ALIAS\",\"messages\":[{\"role\":\"user\",\"content\":\"$MARKER after-restart\"}],\"max_tokens\":8}" \
                "$LITELLM/v1/chat/completions"
              grep -Eq '"content"[[:space:]]*:[[:space:]]*"[^\"]+' /tmp/recovery.json
              curl -fsS --max-time 10 -H "Authorization: Bearer $PROXY_MASTER_KEY" \
                "$LITELLM/metrics" > /tmp/litellm-after-recovery.metrics
              metric_increased "$recovery_requests_before" \
                "$(metric_sum 'litellm_proxy_total_requests_metric_total' /tmp/litellm-after-recovery.metrics)"
              wait_prom litellm-new-pod-scraped \
                "up{namespace=\"$NAMESPACE\",service=\"litellm\",pod=\"$new_pod_name\"} == 1"

              STEP="all assertions passed"
              RESULT="PASS"
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi

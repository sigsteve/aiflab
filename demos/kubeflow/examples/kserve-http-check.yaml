apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: aiflab-kserve-check
  namespace: kubeflow-user-example-com
  labels:
    app.kubernetes.io/part-of: aiflab-kubeflow
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: dp.apps.rancher.io/containers/bci-busybox:15.7-24.1
        command:
          - /bin/sh
          - -ec
        args:
          - |-
            while true; do
              printf 'HTTP/1.1 200 OK\r\nContent-Length: 17\r\nConnection: close\r\n\r\naiflab-kserve-ok\n' |
                nc -l -p 8080
            done
        ports:
          - name: http1
            containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiflab-notebook-storage-check
  namespace: kubeflow-user-example-com
  labels:
    app.kubernetes.io/part-of: aiflab-kubeflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: aiflab-storage-check
  namespace: kubeflow-user-example-com
  labels:
    app.kubernetes.io/part-of: aiflab-kubeflow
spec:
  template:
    spec:
      serviceAccountName: default-editor
      containers:
        - name: aiflab-storage-check
          image: dp.apps.rancher.io/containers/bci-busybox:15.7-24.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - while true; do sleep 3600; done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: workspace
              mountPath: /home/jovyan
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: aiflab-notebook-storage-check

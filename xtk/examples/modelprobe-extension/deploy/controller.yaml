apiVersion: v1
kind: Namespace
metadata:
  name: xtk-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modelprobe-controller
  namespace: xtk-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modelprobe-controller
rules:
  - apiGroups:
      - xtk.aiflab.io
    resources:
      - modelprobes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - xtk.aiflab.io
    resources:
      - modelprobes/status
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modelprobe-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modelprobe-controller
subjects:
  - kind: ServiceAccount
    name: modelprobe-controller
    namespace: xtk-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelprobe-controller
  namespace: xtk-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modelprobe-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modelprobe-controller
    spec:
      serviceAccountName: modelprobe-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: localhost/xtk-modelprobe-controller:0.1.0
          imagePullPolicy: Never
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

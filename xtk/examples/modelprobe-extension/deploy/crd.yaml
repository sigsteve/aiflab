apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelprobes.xtk.aiflab.io
spec:
  group: xtk.aiflab.io
  names:
    kind: ModelProbe
    listKind: ModelProbeList
    plural: modelprobes
    singular: modelprobe
    shortNames:
      - mprobe
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Healthy
          type: boolean
          jsonPath: .status.healthy
        - name: Latency
          type: integer
          jsonPath: .status.latencyMs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  pattern: ^https?://
                intervalSeconds:
                  type: integer
                  format: int32
                  default: 30
                  minimum: 10
                  maximum: 3600
                expectStatus:
                  type: integer
                  format: int32
                  default: 200
            status:
              type: object
              properties:
                healthy:
                  type: boolean
                lastStatusCode:
                  type: integer
                  format: int32
                latencyMs:
                  type: integer
                  format: int64
                lastProbeTime:
                  type: string
                  format: date-time
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
      subresources:
        status: {}
